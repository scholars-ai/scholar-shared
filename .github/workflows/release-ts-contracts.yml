name: Release TypeScript contracts

on:
  push:
    tags:
      - contracts-v*

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="contracts-v$(node -p "require('./gen/ts/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - name: Publish to npm with Trusted Publishing
        run: npm publish ./gen/ts
