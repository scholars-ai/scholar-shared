name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Validate contracts (schema / rubrics / queues)
        run: uv run --no-project --with jsonschema --with pyyaml scripts/validate.py
      - name: Regenerate code
        run: ./scripts/generate.sh
      - name: Generated code must be committed (no drift)
        run: git diff --exit-code gen/
      - name: Build generated Go module
        run: cd gen/go && go build ./...
