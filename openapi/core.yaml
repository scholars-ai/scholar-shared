openapi: 3.0.3
info:
  title: scholar-core API
  version: 0.1.0
  description: |
    scholars-ai 业务核心 REST API 契约（M0 骨架，随里程碑扩展）。
    实体结构的单一事实来源是 ../schemas/scholars.schema.json —— 本文件中的
    schema 是其 API 视图；两者一致性由 CI 逐步覆盖（见仓库 README 开放问题）。
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: 健康检查（含 DB 连通性）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/pipeline/summary:
    get:
      operationId: getPipelineSummary
      summary: 固定节奏内容流水线总览
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSummary"
  /v1/pipeline/runs:
    get:
      operationId: listPipelineRuns
      summary: 最近的固定节奏调度运行
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunList"
  /v1/topics:
    get:
      operationId: listTopics
      summary: 选题列表（按状态过滤，latestScore 倒序）
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TopicStatus"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Topic"
                  total: { type: integer }
    post:
      operationId: createManualTopic
      summary: 手动创建选题（M0 验收：空管道插入一条手动 topic）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/topics/{topicId}:
    get:
      operationId: getTopic
      summary: 选题详情
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/topics/{topicId}/evaluations:
    get:
      operationId: listTopicEvaluations
      summary: 选题的评分历史（维度分 + 理由 + rubric/权重版本，倒序）
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicEvaluation"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/topics/{topicId}/approve:
    post:
      operationId: approveTopic
      summary: 人工确认选题（scored → approved）
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/topics/{topicId}/reject:
    post:
      operationId: rejectTopic
      summary: 人工否决选题（candidate/scored → rejected）
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTopicRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/articles:
    get:
      operationId: listArticles
      summary: 文章审阅列表（可按状态、平台、选题过滤）
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ArticleStatus"
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/Platform"
        - name: topicId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/articles/{articleId}:
    get:
      operationId: getArticle
      summary: 文章详情（原稿、版本链、最新评分和发布记录）
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/articles/{articleId}/evaluations:
    get:
      operationId: listArticleEvaluations
      summary: 文章评分历史（倒序）
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleEvaluation"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/articles/{articleId}/approve:
    post:
      operationId: approveArticle
      summary: 人工终审通过（pending_review → approved）
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/articles/{articleId}/reject:
    post:
      operationId: rejectArticle
      summary: 人工终审拒绝（pending_review → rejected）
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectArticleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/articles/{articleId}/publications:
    post:
      operationId: createPublication
      summary: 登记一次人工发布；首次登记同时执行 approved → published
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/publications:
    get:
      operationId: listPublications
      summary: 发布记录、标准快照完成度与待录提醒
      parameters:
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/Platform"
        - name: remindersOnly
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationPerformanceList"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/publications/{publicationId}/metrics:
    get:
      operationId: listMetricSnapshots
      summary: 一次发布的全部累计指标快照
      parameters:
        - $ref: "#/components/parameters/PublicationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createMetricSnapshot
      summary: 录入一条 24h/72h/7d 或自定义累计指标快照
      parameters:
        - $ref: "#/components/parameters/PublicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMetricSnapshotRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/metrics/import:
    post:
      operationId: importMetricSnapshots
      summary: 原子批量导入 Client 已解析和预检查的 CSV 指标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportMetricSnapshotsRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMetricSnapshotsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/performance/dashboard:
    get:
      operationId: getPerformanceDashboard
      summary: 平台内表现分分布、快照覆盖和近期 high/low case
      parameters:
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/Platform"
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceDashboard"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/insights:
    get:
      operationId: listInsights
      summary: Reflector 经验库
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/InsightKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InsightStatus"
        - name: platform
          in: query
          schema:
            $ref: "#/components/schemas/Platform"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/insights/{insightId}:
    patch:
      operationId: updateInsight
      summary: 人工启用或退役一条经验
      parameters:
        - $ref: "#/components/parameters/InsightId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInsightRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insight"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/reports/weekly:
    get:
      operationId: listWeeklyReports
      summary: 周度归因与评分校准报告
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 52, default: 12 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyReport"
  /v1/reflections/run:
    post:
      operationId: triggerMemoryReflect
      summary: 手动触发指定周期或最近七天的反思
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerMemoryReflectRequest"
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/sources:
    get:
      operationId: listSources
      summary: 信源列表（含采集健康状态）
      parameters:
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceWithHealth"
    post:
      operationId: createSource
      summary: 新增信源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sources/{sourceId}:
    get:
      operationId: getSource
      summary: 信源详情
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceWithHealth"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSource
      summary: 修改信源（含启停与单独采集频率覆盖）
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSource
      summary: 删除信源（已采集的 raw_items 保留，仅解除订阅）
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sources/{sourceId}/fetch:
    post:
      operationId: triggerSourceFetch
      summary: 立即采集该信源（不等调度）
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/ingest/url:
    post:
      operationId: ingestUrl
      summary: 手动投喂 URL（刷到好东西时的一键入口，SPEC-003 §2.2）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestUrlRequest"
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/settings/schedules:
    get:
      operationId: getSchedulerSettings
      summary: 读调度设置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerSettings"
    patch:
      operationId: updateSchedulerSettings
      summary: 改调度设置（≤ 1 个 tick 生效；重启不被环境变量覆盖）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulerSettingsPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/scout/run:
    post:
      operationId: triggerTopicScout
      summary: 立即跑一次选题聚合（不等调度；忽略 minNewItems）
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workflow/runs:
    get:
      operationId: listWorkflowRuns
      summary: 查询工作流运行记录
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunList"
    post:
      operationId: createWorkflowRun
      summary: 手动触发一次内容流水线
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRunRequest"
      responses:
        "202":
          description: 已创建并入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workflow/runs/{runId}:
    get:
      operationId: getWorkflowRun
      summary: 查询一次工作流运行
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflow/runs/{runId}/events:
    get:
      operationId: listWorkflowEvents
      summary: 查询工作流事件
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowEvent"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflow/runs/{runId}/artifacts:
    get:
      operationId: listWorkflowArtifacts
      summary: 查询工作流产物
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowArtifact"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflow/runs/{runId}/snapshots/{snapshotId}:
    get:
      operationId: getWorkflowSnapshot
      summary: 查询工作流节点输入输出快照
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: snapshotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflow/runs/{runId}/stream:
    get:
      operationId: streamWorkflowRun
      summary: 订阅工作流事件
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflow/runs/{runId}/nodes/{nodeKey}/decisions:
    get:
      operationId: listWorkflowNodeDecisions
      summary: 查询节点逐条判定
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: nodeKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WorkflowNodeKey"
        - name: decision
          in: query
          schema:
            $ref: "#/components/schemas/WorkflowDecision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowItemDecision" }
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflow/runs/{runId}/replay:
    post:
      operationId: replayWorkflowRun
      summary: 从指定节点创建不可变 replay 子运行
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayWorkflowRequest"
      responses:
        "202":
          description: replay 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRun" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workflow/runs/{runId}/compare:
    post:
      operationId: compareWorkflowRuns
      summary: 比较父运行与 replay 运行
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otherRunId]
              properties:
                otherRunId: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRunComparison" }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    TopicId:
      name: topicId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArticleId:
      name: articleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InsightId:
      name: insightId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 请求非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与当前状态冲突（如非法状态流转、重名信源、功能已停用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PipelineStageSummary:
      type: object
      required: [key, label, cadenceMinutes, total, ready, passed, failed, rewrites, lastRunAt, nextRunAt]
      properties:
        key: { type: string, enum: [source_fetch, topic_scout, article_write] }
        label: { type: string }
        cadenceMinutes: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        ready: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        rewrites: { type: integer, minimum: 0 }
        lastRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
    PipelineError:
      type: object
      required: [id, queue, errorType, message, retryable, createdAt]
      properties:
        id: { type: string, format: uuid }
        queue: { type: string }
        errorType: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
    PipelineSummary:
      type: object
      required: [generatedAt, stages, recentErrors]
      properties:
        generatedAt: { type: string, format: date-time }
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStageSummary"
        recentErrors:
          type: array
          items:
            $ref: "#/components/schemas/PipelineError"
    PipelineRun:
      type: object
      required: [id, scheduleKey, plannedAt, enqueuedAt, queue, msgId, note]
      properties:
        id: { type: string, format: uuid }
        scheduleKey: { type: string }
        plannedAt: { type: string, format: date-time }
        enqueuedAt: { type: string, format: date-time }
        queue: { type: string }
        msgId: { type: integer, format: int64, nullable: true }
        note: { type: string, nullable: true }
    PipelineRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRun"
    WorkflowRun:
      type: object
      required: [id, correlationId, mode, triggerType, startNode, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/WorkflowRunMode" }
        triggerType: { $ref: "#/components/schemas/WorkflowTriggerType" }
        startNode: { $ref: "#/components/schemas/WorkflowNodeKey" }
        status: { $ref: "#/components/schemas/WorkflowRunStatus" }
        parentRunId: { type: string, format: uuid, nullable: true }
        replayFromNode: { $ref: "#/components/schemas/WorkflowNodeKey", nullable: true }
        replayScope: { type: object, additionalProperties: true, nullable: true }
        inputSnapshotId: { type: string, format: uuid, nullable: true }
        configSnapshotId: { type: string, format: uuid, nullable: true }
        summary: { type: object, additionalProperties: true }
        errorMessage: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
    CreateWorkflowRunRequest:
      type: object
      properties:
        sourceIds:
          type: array
          items: { type: string, format: uuid }
        metadata: { type: object, additionalProperties: true }
    WorkflowRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRun"
    WorkflowRunDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowRun"
        - type: object
          required: [events, artifacts, nodeRuns, decisions]
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/WorkflowEvent" }
            artifacts:
              type: array
              items: { $ref: "#/components/schemas/WorkflowArtifact" }
            nodeRuns:
              type: array
              items: { $ref: "#/components/schemas/WorkflowNodeRun" }
            decisions:
              type: array
              items: { $ref: "#/components/schemas/WorkflowItemDecision" }
    WorkflowEvent:
      type: object
      required: [id, runId, sequence, nodeKey, eventType, status, message, payload, occurredAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        sequence: { type: integer, format: int64 }
        nodeKey: { type: string }
        eventType: { type: string }
        status: { type: string }
        message: { type: string }
        agentRunId: { type: string, format: uuid, nullable: true }
        payload: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    WorkflowNodeRun:
      type: object
      required: [id, runId, nodeKey, status, configSnapshot, counts, createdAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        nodeKey: { $ref: "#/components/schemas/WorkflowNodeKey" }
        status: { $ref: "#/components/schemas/WorkflowNodeStatus" }
        inputSnapshotId: { type: string, format: uuid, nullable: true }
        outputSnapshotId: { type: string, format: uuid, nullable: true }
        configSnapshot: { type: object, additionalProperties: true }
        counts: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
    WorkflowItemDecision:
      type: object
      required: [id, runId, nodeRunId, itemId, itemType, decision, reasonCode, reason, inputRefs, evidenceRefs, createdAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        nodeRunId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemType: { $ref: "#/components/schemas/WorkflowItemType" }
        decision: { $ref: "#/components/schemas/WorkflowDecision" }
        reasonCode: { type: string }
        reason: { type: string }
        dimensionScores: { type: object, additionalProperties: { type: number }, nullable: true }
        totalScore: { type: number, minimum: 0, maximum: 100, nullable: true }
        threshold: { type: number, nullable: true }
        weightVersion: { type: integer, minimum: 1, nullable: true }
        rubricVersion: { type: string, nullable: true }
        inputRefs: { type: object, additionalProperties: true }
        evidenceRefs: { type: object, additionalProperties: true }
        agentRunId: { type: string, format: uuid, nullable: true }
        traceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    WorkflowArtifact:
      type: object
      required: [id, runId, nodeKey, artifactType, artifactId, title, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        nodeKey: { type: string }
        artifactType: { type: string }
        artifactId: { type: string, format: uuid }
        parentArtifactId: { type: string, format: uuid, nullable: true }
        snapshotId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    WorkflowSnapshot:
      type: object
      required: [id, runId, kind, payload, sha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        kind: { type: string, enum: [definition, input, output, config] }
        payload: { type: object, additionalProperties: true }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        createdAt: { type: string, format: date-time }
    WorkflowConfigSnapshot:
      type: object
      description: 配置快照 payload；由 Core 固化并由 replay 继承。
      required: [schemaVersion, configVersion, workflowVersion, triggerType, overrides, requestedOverrides, effective, resolution]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        configVersion: { type: string, minLength: 1 }
        workflowVersion: { type: string, minLength: 1 }
        triggerType: { $ref: "#/components/schemas/WorkflowTriggerType" }
        overrides: { type: object, additionalProperties: true }
        requestedOverrides: { type: object, additionalProperties: true }
        effective: { type: object, additionalProperties: true }
        resolution:
          type: object
          required: [status, resolvedBy, agentOwned]
          properties:
            status: { type: string, enum: [validated] }
            resolvedBy: { type: string, enum: [core] }
            agentOwned:
              type: array
              items: { type: string }
    WorkflowDecision:
      type: string
      enum: [accepted, rejected, skipped, failed]
    WorkflowItemType:
      type: string
      enum: [raw_item, topic, article]
    WorkflowRunMode:
      type: string
      enum: [content_production]
    WorkflowRunStatus:
      type: string
      enum: [queued, running, waiting_human_review, completed, completed_empty, partial_failed, failed, cancelled]
    WorkflowNodeKey:
      type: string
      enum: [source_fetch, topic_scout, topic_evaluate, article_write, article_evaluate, human_review]
    WorkflowNodeStatus:
      type: string
      enum: [queued, running, succeeded, partial_failed, failed, skipped, cancelled]
    WorkflowTriggerType:
      type: string
      enum: [scheduled, manual, replay]
    ReplayMode:
      type: string
      enum: [full, failed_items, selected_items, evaluate_only]
    ReplayScope:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/ReplayMode" }
        itemIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        useCurrentInput:
          type: boolean
          default: false
          description: 显式使用当前数据重新解析输入；默认严格复用父运行快照
    WorkflowConfigOverrides:
      type: object
      additionalProperties: false
      properties:
        agentVersion: { type: string, minLength: 1 }
        promptVersion: { type: string, minLength: 1 }
        rubricVersion: { type: string, minLength: 1 }
        topicRubricVersion: { type: string, minLength: 1 }
        articleRubricVersion: { type: string, minLength: 1 }
        weightVersion: { type: integer, minimum: 1 }
        topicWeightVersion: { type: integer, minimum: 1 }
        articleWeightVersion: { type: integer, minimum: 1 }
        model: { type: string, minLength: 1 }
        topicScoutModel: { type: string, minLength: 1 }
        topicJudgeModel: { type: string, minLength: 1 }
        outlineModel: { type: string, minLength: 1 }
        draftModel: { type: string, minLength: 1 }
        criticModel: { type: string, minLength: 1 }
        articleJudgeModel: { type: string, minLength: 1 }
        passThreshold: { type: number, minimum: 0, maximum: 100 }
        topicPassThreshold: { type: number, minimum: 0, maximum: 100 }
        articlePassThreshold: { type: number, minimum: 0, maximum: 100 }
        maxConcurrency: { type: integer, minimum: 1, maximum: 32 }
        maxBatchSize: { type: integer, minimum: 1, maximum: 1000 }
    ReplayWorkflowRequest:
      type: object
      required: [replayFromNode, replayScope]
      properties:
        replayFromNode: { $ref: "#/components/schemas/WorkflowNodeKey" }
        replayScope: { $ref: "#/components/schemas/ReplayScope" }
        configOverrides: { $ref: "#/components/schemas/WorkflowConfigOverrides" }
        reason: { type: string, minLength: 1 }
    WorkflowRunComparison:
      type: object
      required: [baseRunId, otherRunId, sameInput, stages, reasonCounts]
      properties:
        baseRunId: { type: string, format: uuid }
        otherRunId: { type: string, format: uuid }
        sameInput: { type: boolean }
        stages:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WorkflowStageComparison"
        reasonCounts: { type: object, additionalProperties: true }
        cost: { type: object, additionalProperties: true }
        artifacts: { type: object, additionalProperties: true }
    WorkflowStageComparison:
      type: object
      required: [base, other]
      properties:
        base: { $ref: "#/components/schemas/WorkflowStageMetrics" }
        other: { $ref: "#/components/schemas/WorkflowStageMetrics" }
    WorkflowStageMetrics:
      type: object
      properties:
        inputCount: { type: integer, minimum: 0 }
        outputCount: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        passRate: { type: number, minimum: 0, maximum: 1, nullable: true }
        durationSeconds: { type: number, minimum: 0, nullable: true }
        scoreDistribution: { type: object, additionalProperties: true }
        tokenCount: { type: integer, minimum: 0, nullable: true }
        cost: { type: number, minimum: 0, nullable: true }
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok] }
        db: { type: string, enum: [ok, down] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Platform:
      type: string
      enum: [xiaohongshu, zhihu, wechat]
    TopicStatus:
      type: string
      enum: [candidate, scored, approved, in_writing, written, rejected]
    Topic:
      type: object
      required: [id, title, angle, summary, rawItemIds, targetPlatforms, status, latestScore]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        angle: { type: string }
        summary: { type: string }
        rawItemIds:
          type: array
          items: { type: string, format: uuid }
        targetPlatforms:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Platform"
        status:
          $ref: "#/components/schemas/TopicStatus"
        latestScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
    CreateTopicRequest:
      type: object
      required: [title, angle, summary, targetPlatforms]
      properties:
        title: { type: string, minLength: 1 }
        angle: { type: string }
        summary: { type: string }
        targetPlatforms:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Platform"
    RejectTopicRequest:
      type: object
      properties:
        reason: { type: string, description: 否决原因（留痕，供后续 rubric 校准参考） }

    ArticleStatus:
      type: string
      enum: [draft, scored, rewrite_queued, pending_review, approved, published, rejected]
    ArticleFormat:
      type: string
      enum: [markdown, html, rich_text]
    Article:
      type: object
      required: [id, topicId, platform, version, previousArticleId, format, title, contentMd, assets, writerAgent, status, latestScore, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        topicId: { type: string, format: uuid }
        platform:
          $ref: "#/components/schemas/Platform"
        version: { type: integer, minimum: 1 }
        previousArticleId: { type: string, format: uuid, nullable: true }
        format:
          $ref: "#/components/schemas/ArticleFormat"
        title: { type: string }
        contentMd: { type: string }
        assets:
          type: array
          items: { type: object, additionalProperties: true }
        writerAgent: { type: string }
        status:
          $ref: "#/components/schemas/ArticleStatus"
        latestScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ArticleEvaluation:
      type: object
      required: [id, articleId, rubricVersion, weightVersion, dimensionScores, dimensionReasons, totalScore, rationale, judgeModel, vetoedDimension, passThreshold, passed, agentRunId, createdAt]
      properties:
        id: { type: string, format: uuid }
        articleId: { type: string, format: uuid }
        rubricVersion: { type: string }
        weightVersion: { type: integer, nullable: true }
        dimensionScores:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 10 }
        dimensionReasons:
          type: object
          additionalProperties: { type: string }
        totalScore: { type: number, minimum: 0, maximum: 100 }
        rationale: { type: string }
        judgeModel: { type: string }
        vetoedDimension: { type: string, nullable: true }
        passThreshold: { type: number, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        agentRunId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    Publication:
      type: object
      required: [id, articleId, platform, platformPostId, publishedAt, finalContentDiff, editRatio, followerCountAtPublish, createdAt]
      properties:
        id: { type: string, format: uuid }
        articleId: { type: string, format: uuid }
        platform:
          $ref: "#/components/schemas/Platform"
        platformPostId: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        finalContentDiff: { type: string, nullable: true }
        editRatio: { type: number, nullable: true, minimum: 0, maximum: 1 }
        followerCountAtPublish: { type: integer, nullable: true, minimum: 0 }
        createdAt: { type: string, format: date-time }
    MetricSource:
      type: string
      enum: [manual, import, api]
    MetricWindow:
      type: string
      enum: [h24, h72, d7, custom]
    EngagementMetrics:
      type: object
      required: [views, likes, favorites, comments, shares, follows]
      properties:
        views: { type: integer, nullable: true, minimum: 0 }
        likes: { type: integer, nullable: true, minimum: 0 }
        favorites: { type: integer, nullable: true, minimum: 0 }
        comments: { type: integer, nullable: true, minimum: 0 }
        shares: { type: integer, nullable: true, minimum: 0 }
        follows: { type: integer, nullable: true, minimum: 0 }
    CreateMetricSnapshotRequest:
      type: object
      required: [snapshotWindow, capturedAt, metrics]
      properties:
        snapshotWindow:
          $ref: "#/components/schemas/MetricWindow"
        capturedAt: { type: string, format: date-time }
        metrics:
          $ref: "#/components/schemas/EngagementMetrics"
    MetricSnapshotImportItem:
      allOf:
        - $ref: "#/components/schemas/CreateMetricSnapshotRequest"
        - type: object
          required: [publicationId]
          properties:
            publicationId: { type: string, format: uuid }
    ImportMetricSnapshotsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/MetricSnapshotImportItem"
    ImportMetricSnapshotsResult:
      type: object
      required: [imported, snapshots]
      properties:
        imported: { type: integer, minimum: 1 }
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/MetricSnapshot"
    MetricSnapshot:
      type: object
      required: [id, publicationId, capturedAt, snapshotWindow, metrics, source, performanceRaw, performancePercentile, performanceWeightVersion, createdAt]
      properties:
        id: { type: string, format: uuid }
        publicationId: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        snapshotWindow:
          $ref: "#/components/schemas/MetricWindow"
        metrics:
          $ref: "#/components/schemas/EngagementMetrics"
        source:
          $ref: "#/components/schemas/MetricSource"
        performanceRaw: { type: number, minimum: 0 }
        performancePercentile: { type: number, nullable: true, minimum: 0, maximum: 100 }
        performanceWeightVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    MetricReminder:
      type: object
      required: [snapshotWindow, dueAt, overdue]
      properties:
        snapshotWindow:
          $ref: "#/components/schemas/MetricWindow"
        dueAt: { type: string, format: date-time }
        overdue: { type: boolean }
    PublicationPerformance:
      type: object
      required: [publication, articleTitle, topicTitle, snapshots, reminders]
      properties:
        publication:
          $ref: "#/components/schemas/Publication"
        articleTitle: { type: string }
        topicTitle: { type: string }
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/MetricSnapshot"
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/MetricReminder"
    PublicationPerformanceList:
      type: object
      required: [items, total, overdueCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicationPerformance"
        total: { type: integer, minimum: 0 }
        overdueCount: { type: integer, minimum: 0 }
    PerformanceCase:
      type: object
      required: [publicationId, articleId, platform, title, snapshotWindow, percentile, performanceRaw, capturedAt, band]
      properties:
        publicationId: { type: string, format: uuid }
        articleId: { type: string, format: uuid }
        platform:
          $ref: "#/components/schemas/Platform"
        title: { type: string }
        snapshotWindow:
          $ref: "#/components/schemas/MetricWindow"
        percentile: { type: number, minimum: 0, maximum: 100 }
        performanceRaw: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        band: { type: string, enum: [high, normal, low] }
    PlatformPerformanceSummary:
      type: object
      required: [platform, publications, snapshots, complete24h, complete72h, complete7d, highCount, lowCount]
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        publications: { type: integer, minimum: 0 }
        snapshots: { type: integer, minimum: 0 }
        complete24h: { type: integer, minimum: 0 }
        complete72h: { type: integer, minimum: 0 }
        complete7d: { type: integer, minimum: 0 }
        highCount: { type: integer, minimum: 0 }
        lowCount: { type: integer, minimum: 0 }
    PerformanceDashboard:
      type: object
      required: [days, summaries, cases]
      properties:
        days: { type: integer, minimum: 7 }
        summaries:
          type: array
          items:
            $ref: "#/components/schemas/PlatformPerformanceSummary"
        cases:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceCase"
    InsightKind:
      type: string
      enum: [topic_lesson, writing_lesson, platform_lesson, source_lesson]
    InsightStatus:
      type: string
      enum: [candidate, active, retired]
    InsightEvidence:
      type: object
      required: [articleIds, publicationIds, note]
      properties:
        articleIds:
          type: array
          items: { type: string, format: uuid }
        publicationIds:
          type: array
          items: { type: string, format: uuid }
        note: { type: string, minLength: 1 }
    Insight:
      type: object
      required: [id, kind, platform, content, evidence, confidence, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/InsightKind"
        platform:
          allOf:
            - $ref: "#/components/schemas/Platform"
          nullable: true
        content: { type: string }
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InsightEvidence"
        confidence: { type: number, minimum: 0, maximum: 1 }
        status:
          $ref: "#/components/schemas/InsightStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateInsightRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, retired]
    CorrelationResult:
      type: object
      required: [key, sampleSize, coefficient]
      properties:
        key: { type: string }
        sampleSize: { type: integer, minimum: 0 }
        coefficient: { type: number, nullable: true, minimum: -1, maximum: 1 }
    CalibrationReport:
      type: object
      required: [coldStart, correlations, highCases, lowCases]
      properties:
        coldStart: { type: boolean }
        correlations:
          type: array
          items:
            $ref: "#/components/schemas/CorrelationResult"
        highCases:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceCase"
        lowCases:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceCase"
    WeeklyReport:
      type: object
      required: [id, periodStart, periodEnd, sampleCount, summaryMarkdown, calibration, agentRunId, createdAt]
      properties:
        id: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        sampleCount: { type: integer, minimum: 0 }
        summaryMarkdown: { type: string }
        calibration:
          $ref: "#/components/schemas/CalibrationReport"
        agentRunId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    TriggerMemoryReflectRequest:
      type: object
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
    ArticleReview:
      type: object
      required: [article, topicTitle, publicationCount]
      properties:
        article:
          $ref: "#/components/schemas/Article"
        topicTitle: { type: string }
        latestEvaluation:
          $ref: "#/components/schemas/ArticleEvaluation"
        publicationCount: { type: integer, minimum: 0 }
    ArticleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleReview"
        total: { type: integer, minimum: 0 }
    ArticleDetail:
      type: object
      required: [article, topic, versions, evaluations, publications]
      properties:
        article:
          $ref: "#/components/schemas/Article"
        topic:
          $ref: "#/components/schemas/Topic"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/ArticleEvaluation"
        publications:
          type: array
          items:
            $ref: "#/components/schemas/Publication"
    RejectArticleRequest:
      type: object
      properties:
        reason: { type: string, description: 终审拒绝原因 }
    CreatePublicationRequest:
      type: object
      required: [platformPostId, finalTitle, finalContentMd]
      properties:
        platformPostId: { type: string, minLength: 1, description: 平台侧 ID 或公开链接 }
        publishedAt: { type: string, format: date-time, description: 未传时由 Core 使用当前时间 }
        finalTitle: { type: string, minLength: 1 }
        finalContentMd: { type: string, minLength: 1 }
        followerCountAtPublish: { type: integer, nullable: true, minimum: 0 }

    TopicEvaluation:
      type: object
      required: [id, topicId, rubricVersion, weightVersion, dimensionScores, totalScore, rationale, judgeModel, createdAt]
      properties:
        id: { type: string, format: uuid }
        topicId: { type: string, format: uuid }
        rubricVersion: { type: string, description: 如 topic@v1 }
        weightVersion:
          type: integer
          nullable: true
          description: 生效权重版本（weight_sets.version），使评分可回放
        dimensionScores:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 10 }
        dimensionReasons:
          type: object
          additionalProperties: { type: string }
          description: 逐维度理由
        totalScore: { type: number, minimum: 0, maximum: 100 }
        rationale: { type: string }
        judgeModel: { type: string }
        vetoedDimension:
          type: string
          nullable: true
          description: 触发一票否决的维度 key（topic@v1 暂无 veto 维度，但字段就位）
        agentRunId:
          type: string
          format: uuid
          nullable: true
        createdAt: { type: string, format: date-time }

    SourceType:
      type: string
      enum: [rss, rsshub, manual, crawler]
    SourceCategory:
      type: string
      enum: [news, research, tutorial, kol]
    SourceRole:
      type: string
      enum: [material, signal]
    FullTextStrategy:
      type: string
      enum: [rss_description, fetch_page]
    SourceFetchConfig:
      type: object
      description: 单源采集配置；intervalMinutes 为空表示沿用全局默认
      properties:
        role:
          $ref: "#/components/schemas/SourceRole"
        fullText:
          $ref: "#/components/schemas/FullTextStrategy"
        maxItems: { type: integer, minimum: 1, maximum: 500 }
        maxAgeDays: { type: integer, minimum: 1, maximum: 365 }
        intervalMinutes:
          type: integer
          nullable: true
          minimum: 5
          maximum: 10080
    Source:
      type: object
      required: [id, name, type, url, category, weight, enabled, fetchConfig]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        type:
          $ref: "#/components/schemas/SourceType"
        url:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/SourceCategory"
        weight: { type: number, minimum: 0, maximum: 1 }
        enabled: { type: boolean }
        fetchConfig:
          $ref: "#/components/schemas/SourceFetchConfig"
    SourceHealth:
      type: object
      required: [consecutiveFailures]
      properties:
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
        consecutiveFailures: { type: integer, minimum: 0 }
        lastError: { type: string, nullable: true }
        itemCount: { type: integer, minimum: 0, description: 该源累计入库条目数 }
    SourceWithHealth:
      allOf:
        - $ref: "#/components/schemas/Source"
        - type: object
          required: [health]
          properties:
            health:
              $ref: "#/components/schemas/SourceHealth"
    SourceInput:
      type: object
      required: [name, type, category]
      properties:
        name: { type: string, minLength: 1 }
        type:
          $ref: "#/components/schemas/SourceType"
        url:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/SourceCategory"
        weight: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        enabled: { type: boolean, default: true }
        fetchConfig:
          $ref: "#/components/schemas/SourceFetchConfig"
    SourcePatch:
      type: object
      description: 仅传需要改的字段
      properties:
        name: { type: string, minLength: 1 }
        url:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/SourceCategory"
        weight: { type: number, minimum: 0, maximum: 1 }
        enabled: { type: boolean }
        fetchConfig:
          $ref: "#/components/schemas/SourceFetchConfig"

    IngestUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        note: { type: string, description: 备注（为什么觉得这条值得写） }
    JobAccepted:
      type: object
      required: [queue, msgId]
      properties:
        queue: { type: string }
        msgId: { type: integer, format: int64 }

    SourceFetchSchedule:
      type: object
      required: [enabled, defaultIntervalMinutes]
      properties:
        enabled: { type: boolean }
        defaultIntervalMinutes: { type: integer, minimum: 5, maximum: 10080 }
    TopicScoutSchedule:
      type: object
      required: [enabled, times, timezone, minNewItems]
      properties:
        enabled: { type: boolean }
        times:
          type: array
          minItems: 1
          maxItems: 24
          items: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string, minLength: 1 }
        minNewItems: { type: integer, minimum: 0, maximum: 1000 }
    TopicEvaluateSchedule:
      type: object
      required: [enabled, maxConcurrency]
      properties:
        enabled: { type: boolean }
        maxConcurrency: { type: integer, minimum: 1, maximum: 32 }
    ArticleWriteSchedule:
      type: object
      required: [enabled, times, timezone, maxTopics]
      properties:
        enabled: { type: boolean }
        times:
          type: array
          minItems: 1
          maxItems: 24
          items: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string, minLength: 1 }
        maxTopics: { type: integer, minimum: 1, maximum: 20 }
    MemoryReflectSchedule:
      type: object
      required: [enabled, weekday, time, timezone, lookbackDays]
      properties:
        enabled: { type: boolean }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string, minLength: 1 }
        lookbackDays: { type: integer, minimum: 1, maximum: 90 }
    SchedulerSettings:
      type: object
      required: [contentWorkflow, sourceFetch, topicScout, topicEvaluate, articleWrite, memoryReflect]
      properties:
        contentWorkflow:
          $ref: "#/components/schemas/ContentWorkflowSchedule"
        sourceFetch:
          $ref: "#/components/schemas/SourceFetchSchedule"
        topicScout:
          $ref: "#/components/schemas/TopicScoutSchedule"
        topicEvaluate:
          $ref: "#/components/schemas/TopicEvaluateSchedule"
        articleWrite:
          $ref: "#/components/schemas/ArticleWriteSchedule"
        memoryReflect:
          $ref: "#/components/schemas/MemoryReflectSchedule"
    ContentWorkflowSchedule:
      type: object
      required: [enabled, intervalHours]
      properties:
        enabled: { type: boolean }
        intervalHours: { type: integer, minimum: 1, maximum: 168 }
    SchedulerSettingsPatch:
      type: object
      description: 仅传需要改的分组
      properties:
        contentWorkflow:
          $ref: "#/components/schemas/ContentWorkflowSchedule"
        sourceFetch:
          $ref: "#/components/schemas/SourceFetchSchedule"
        topicScout:
          $ref: "#/components/schemas/TopicScoutSchedule"
        topicEvaluate:
          $ref: "#/components/schemas/TopicEvaluateSchedule"
        articleWrite:
          $ref: "#/components/schemas/ArticleWriteSchedule"
        memoryReflect:
          $ref: "#/components/schemas/MemoryReflectSchedule"
